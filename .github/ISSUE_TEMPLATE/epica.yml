name: Épica
description: Épica del backlog, agrupa historias vinculadas a un objetivo específico
title: "E0 - "
labels: ["tipo:epica"]
body:
  - type: dropdown
    id: objetivo
    attributes:
      label: Objetivo del proyecto de título
      options:
        - "Transversal (infraestructura)"
        - "OE1"
        - "OE2"
        - "OE3"
        - "OE4"
        - "OE5"
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué cubre esta épica y qué entrega al cerrarse
    validations:
      required: true

  - type: textarea
    id: historias
    attributes:
      label: Historias incluidas
      description: Lista de issues de historias de usuario que pertenecen a esta épica
      value: |
        - [ ] HU-XX.X
        - [ ] HU-XX.X
    validations:
      required: true

  - type: input
    id: depende_de
    attributes:
      label: Depende de la épica
      description: Épica anterior que debe cerrarse primero (si aplica)
      placeholder: "E1"
    validations:
      required: false

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - "P0 - bloqueante"
        - "P1 - necesario"
        - "P2 - cierre"
    validations:
      required: true
