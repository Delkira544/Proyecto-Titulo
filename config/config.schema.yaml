# Valida config.yaml al iniciar Snakemake: falla rápido y con mensaje claro.
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [proyecto, rutas, temporadas, ingesta, seleccion, calidad, sensor, escenas, gee, indices, indices_export, umbrales, semilla_aleatoria]
properties:
  proyecto:
    type: object
    required: [nombre, prefijo_id]
    properties:
      prefijo_id: {type: string, pattern: '^[a-z]+$'}
  rutas:
    type: object
    required: [raw_incendios, raw_conaf, external_meta, interim, processed, results, logs, esquema_columnas, catastro_sit, raw_incendios_puntos]
  temporadas:
    type: array
    minItems: 1
    items: {type: string, pattern: '^\d{4}_\d{4}$'}
  fuentes_raw: {type: object}
  ingesta: {type: object, required: [crs_trabajo, encoding_si_falta_cpg]}
  seleccion:
    type: object
    required: [periodos, superficie_min_ha, region_codigo, region_valores_aceptados]
    properties:
      superficie_min_ha: {type: number, minimum: 0}
      puntos_tolerancia_superficie_pct: {type: number, minimum: 0}
      region_codigo: {type: integer}
      region_valores_aceptados: {type: array, items: {type: string}}
      periodos:
        type: object
        required: [calibracion, validacion]
        properties:
          calibracion: {type: array, minItems: 2, maxItems: 2, items: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
          validacion: {type: array, minItems: 2, maxItems: 2, items: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
  calidad:
    type: object
    required: [scl_clases_malas, nubosidad_max_pct, cobertura_min_pct, requiere_pre_y_post, minimo_estrato]
    properties:
      scl_clases_malas: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 0, maximum: 11}}
      nubosidad_max_pct: {type: number, minimum: 0, maximum: 100}
      cobertura_min_pct: {type: number, minimum: 0, maximum: 100}
      requiere_pre_y_post: {type: boolean}
      minimo_estrato:
        type: object
        required: [pixeles, incendios, pixeles_por_incendio]
        properties:
          pixeles: {type: integer, minimum: 1}
          incendios: {type: integer, minimum: 1}
          pixeles_por_incendio: {type: integer, minimum: 1}
  sensor:
    type: object
    required: [coleccion_gee, bandas_gee, resolucion_m]
    properties:
      coleccion_gee: {type: string}
      bandas_gee: {type: array, items: {type: string}}
      resolucion_m: {type: number, exclusiveMinimum: 0}
  escenas:
    type: object
    required: [ventana_pre_dias, ventana_post_dias, exploracion_pasos_dias]
    properties:
      ventana_pre_dias: {type: integer, minimum: 1}
      ventana_post_dias: {type: integer, minimum: 1}
      exploracion_pasos_dias: {type: array, minItems: 1, items: {type: integer, minimum: 1}}
  gee:
    type: object
    required: [simplificar_m, miniatura_px, tile_scale, proyecto_env]
    properties:
      simplificar_m: {type: number, minimum: 0}
      miniatura_px: {type: integer, minimum: 64}
      tile_scale: {type: number, minimum: 0.1, maximum: 16}
      proyecto_env: {type: string}
  indices: {type: object, required: [severidad, apoyo]}
  indices_export:
    type: object
    required: [bandas, escala_reflectancia, rdnbr_eps_nbr_pre, bai, mirbi, bai_mirbi_escena, buffer_m, crs_export, nodata, exclusion_borde_px, descarga_max_mb, producto, estratos]
    properties:
      bandas: {type: object, required: [rojo, nir, swir1, swir2]}
      escala_reflectancia: {type: number, exclusiveMinimum: 0}
      rdnbr_eps_nbr_pre: {type: number, exclusiveMinimum: 0}
      bai_mirbi_escena: {type: string, enum: [post]}
      buffer_m: {type: number, minimum: 0}
      crs_export: {type: string, pattern: '^EPSG:\d+$'}
      nodata: {type: number}
      exclusion_borde_px: {type: integer, minimum: 0}
      descarga_max_mb: {type: number, exclusiveMinimum: 0, maximum: 32}
      producto: {type: string, pattern: '^[a-z0-9]+$'}
      estratos:
        type: object
        required: [columna_sit, columna_id_poligono, codigos, codigos_id_uso, por_id_uso]
        properties:
          codigos: {type: object, required: [forestal, urbano, otras]}
          por_id_uso: {type: object, additionalProperties: {enum: [forestal, urbano, otras]}}
  umbrales: {type: object, required: [metodos, estrategias]}
  semilla_aleatoria: {type: integer}
